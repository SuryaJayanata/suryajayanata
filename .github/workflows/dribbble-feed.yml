name: Latest Dribbble Shots
on:
  schedule:
    # Berjalan otomatis setiap hari pada jam 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Memungkinkan Anda untuk menjalankan workflow ini secara manual

jobs:
  update-readme-with-blog:
    name: Update README with Dribbble Feed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull RSS Feed
        uses: gautamkrishnar/blog-post-workflow@master
        with:
         
          feed_list: "https://dribbble.com/surya-j"
