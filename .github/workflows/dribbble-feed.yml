name: Latest Dribbble Shots

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with Dribbble Feed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull RSS Feed
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          feed_list: "https://dribbble.com/surya-j/shots.rss"
